<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #3D452F;
    --text: #FFFAF8;
    --soft: rgba(255, 250, 248, 0.72);
    --line: rgba(255, 250, 248, 0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
    line-height: 1.45;
    padding: 24px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .date {
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--soft); margin-bottom: 20px;
  }
  .label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--soft); margin-bottom: 10px;
  }
  ol { list-style: none; counter-reset: q; }
  ol li {
    counter-increment: q; display: flex; gap: 12px; font-size: 16px;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  ol li:last-child { border-bottom: none; }
  ol li::before { content: counter(q); font-weight: 700; min-width: 14px; color: var(--soft); }
  .divider { height: 1px; background: var(--line); margin: 22px 0; }
  .prompt { font-size: 22px; font-weight: 500; line-height: 1.3; margin-bottom: 22px; }
  .affirmation { font-size: 18px; font-style: italic; }
  @media (min-width: 520px) {
    body { padding: 28px 32px; }
    .prompt { font-size: 24px; }
  }
  /* Side by side when there's room; stacks on phones */
  @media (min-width: 640px) {
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
    .divider { display: none; }
    .today { border-left: 1px solid var(--line); padding-left: 40px; }
  }
</style>
<script>
  // Custom colors: add ?bg=HEX&text=HEX to the link (no # symbol), e.g.
  // https://andreainjapan.github.io/clock-in/?bg=3D452F&text=FFFAF8
  (function () {
    var p = new URLSearchParams(location.search);
    function hex(v) { return v && /^[0-9a-fA-F]{6}$/.test(v.replace('#', '')) ? v.replace('#', '') : null; }
    var bg = hex(p.get('bg')), text = hex(p.get('text'));
    var r = document.documentElement.style;
    if (bg) r.setProperty('--bg', '#' + bg);
    if (text) {
      var n = parseInt(text, 16), rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(', ');
      r.setProperty('--text', '#' + text);
      r.setProperty('--soft', 'rgba(' + rgb + ', 0.72)');
      r.setProperty('--line', 'rgba(' + rgb + ', 0.22)');
    }
  })();
</script>
</head>
<body>
<div class="wrap">
  <p class="date" id="date"></p>
  <div class="cols">
    <div class="daily">
    <p class="label">Every day</p>
    <ol>
      <li>First three thoughts when you woke up</li>
      <li>What are you grateful for today?</li>
      <li>Mood __/10 · Energy __/10</li>
      <li>How are you moving your body today?</li>
      <li>The ONE thing that needs to happen for today to be a good day</li>
    </ol>
    </div>

    <div class="divider"></div>

    <div class="today">
    <p class="label">Today's prompt</p>
    <p class="prompt" id="prompt"></p>
    <p class="label">Today's affirmation</p>
    <p class="affirmation" id="affirmation"></p>
    </div>
  </div>
</div>

<script>
  // Each pair: [prompt, affirmation]. One shows per day, in order, then it loops.
  // To change one, edit the text between the quotes. Add or remove lines freely;
  // the rotation adjusts to however many there are.
  const PAIRS = [
    ["What's the best thing on today's calendar? If nothing jumps out, what could you add?", "If today looks boring, I can sneak something good in."],
    ["What's one win from your business this week, big or small? How did you make it happen?", "Small wins still count. Yes, even finally answering that email."],
    ["What's a job or chapter you usually leave off your bio, and what did it teach you that you still use?", "The detours count too."],
    ["Describe your perfect lazy Saturday. Pajamas are implied.", "The inbox will survive without me for a day."],
    ["Describe something that went smoothly yesterday. What made it click?", "If it worked once, it can work again."],
    ["What's your go-to snack right now, and how many times have you \"just had one\"?", "Snack breaks are a legit part of the workday."],
    ["What does your ideal morning look like? What's one thing that could get you closer to it?", "Good mornings get built a little at a time."],
    ["What's a task you keep putting off like that junk drawer? What's the tiniest first step?", "One small step is still a step, even a tiny, wobbly one."],
    ["Who made your week a little better? What did they do that made the difference?", "I've got good people, and I'm keeping them."],
    ["If today were a color, what would it be? (Hex code optional, but I'd be impressed.) Why that one?", "Today's color is my call."],
    ["What's in your calm-down toolbox right now? Anything you want to add?", "I've got tools for the hard days, and I know where to find them."],
    ["What would you name a boat? Bonus points for a pun. Where's the first place you'd take it?", "It's okay to be completely unserious sometimes."],
    ["If only one thing goes right today, what do you want it to be? What's one thing you can do to help it along?", "One thing done is still more than zero."],
    ["What's something a client has shared that stuck with you? Why do you think it stayed with you?", "The best parts of my work happen between the invoices."],
    ["What's a small everyday comfort you'd miss if it disappeared? When do you reach for it most?", "My little comforts are pulling a lot of weight."],
    ["What's a place you'd love to go back to? What do you miss most about it?", "The places I've been show up in how I see things."],
    ["What has been living rent-free in your head lately? Is any of it worth the space, or is it time to evict?", "Some thoughts should be short-term visitors."],
    ["What's the best thing you've bought for under $20? Why was it worth every penny?", "Good things don't have to be big or expensive."],
    ["What's on your plate today, in a few words? (Not breakfast. Okay, also breakfast if you want.)", "I can take today one bite at a time."],
    ["What part of your business are you enjoying most right now? How could you do more of it?", "The things I enjoy make the hard parts worth it."],
    ["What's the most useless talent you have? How did you discover it?", "Not everything I'm good at has to be useful."],
    ["What's a meal you're still drooling over? Where were you, and who were you with?", "Feeding myself well is part of the job. Desk candy doesn't count as lunch."],
    ["Describe the spot you're sitting in using three details.", "Quick reality check: I'm right here, and I'm okay."],
    ["What's something you said yes to that you're glad about? What have you said no to?", "I trust my yes, and I'm getting better at my no."],
    ["What's the last rabbit hole you stumbled into? Start with what you were originally looking up.", "My brain's side quests are half the fun."],
    ["What's one small thing you can do today that tonight-you will be wildly grateful for?", "Future me will be glad I took care of this."],
    ["What's one thing in your business you'd love to make easier? Describe what easier would actually look like.", "Hard mode all the time is just burnout with extra steps."],
    ["What's a recent moment that made you smile? Relive it in words.", "I'm here for anything that makes me grin."],
    ["What would you create if you had a free afternoon and zero guilt about it?", "My ideas are worth making time for."],
    ["What's a habit you'd like to start, or stop? How could you take the first step this week?", "Tiny steps still get me somewhere."],
    ["This or that, downtime edition: couch potato or get active? Watch a show or read a book? Dinner out or a home-cooked meal? Solo time or with friends? Would your answers change on a hard day versus a good one?", "I know what I need on a hard day, and that's half the battle."],
    ["Describe a standard you won't lower in your work, even when nobody would notice.", "My standards are part of my brand."],
    ["What's something in your business you're proud of building? Which part makes you beam the most?", "I fucking did this, and that's worth celebrating."],
    ["Who encouraged you early on? What did they do that you still remember?", "People believe in me and what I'm doing."],
    ["If your business walked into a party, how would it act? Who would it talk to first?", "My business has a personality."],
    ["What's one thing you'd do differently this week? How would that change things?", "Course-correcting isn't starting over."],
    ["What's your everyday breakfast, and what are you picking on your birthday?", "A good start goes a long way. So does a second coffee."],
    ["What's a small detail of your process clients always notice?", "The little things are doing big work."],
    ["How would you explain what you do to a 12-year-old?", "I'm clear on what I do and who it's for."],
    ["What's something in your home you love? Where did it come from, and what makes it special?", "I've made a space that feels like mine."],
    ["Sum up your week in six words.", "My week doesn't have to be perfect to be good."],
    ["What's something you've gotten better at this year? How can you tell?", "I'm further along than I give myself credit for."],
    ["What's something you didn't expect to go gaga over? How did that happen?", "Getting obsessed with random things is part of my charm."],
    ["What's one thing you can let slide today?", "Not everything needs my energy today."],
    ["What's one thing you learned from your work recently? How will you use it?", "I get sharper with every project, even the messy ones."],
    ["What part of your story do you think is \"too boring\" to share?", "The boring parts are usually the useful ones."],
    ["This or that, getaway edition: chill or adventure? Bed & breakfast or all-inclusive? Plan every detail or wing it? Window seat or aisle? Pick the one you'd defend the hardest and explain why.", "I know what makes me happy."],
    ["What song fits your mood right now? Hit play if you can. Why does it fit? Do you need to change the track?", "My mood can change, and so can the soundtrack."],
    ["What's one thing you want to remember about this week? Why does it matter?", "This week counted, even if it was mundane."],
    ["If you opened a shop, what would it sell? Why this product?", "My ideas don't have to be practical to be fun."],
    ["What would make you smile by lunchtime? (A good email? A great sandwich?)", "I'm on a mission to find joy by noon."],
    ["What's one idea you'd try if you had an extra hour this week?", "Good ideas keep, as long as my journal doesn't become their graveyard."],
    ["Describe something you like about the view outside your window. What do you usually walk right past?", "I don't need a vacation to see something good."],
    ["What's a smell that instantly takes you somewhere? Where does it take you, and what do you remember?", "My memories are part of my story."],
    ["What's something you've wanted to try for ages but keep finding excuses not to? What's the excuse?", "What I want is bigger than my excuses."],
    ["What's the weirdest job you've ever had? How does it show up in your work now?", "Every detour teaches me something."],
    ["Who do you want to check in with today? What do you want to say to them?", "Reaching out to someone is never wasted."],
    ["Who's someone in your field you admire? What could you learn from them?", "Who I admire says something about what I want."],
    ["What's a compliment clients keep giving you that you brush off?", "If they keep saying it, believe that shit!"],
    ["Describe your dream workspace. What's one piece of it you could bring into your space now?", "A better workspace doesn't need a big budget."],
    ["What did you need more of this week: rest, fun, or focus?", "I get to give myself what I need. No permission slip required."],
    ["Describe something that made you laugh recently.", "Laughing counts as self-care. I checked."],
    ["Describe the vibe you want for today in three words. What would help today feel that way?", "I get to set the tone of my day."],
    ["This or that, business edition: paper planner or digital? Batch your work or bounce between tasks? Video call or voice memo? Big launch or quiet rollout? For each, is that what you actually do, or what you wish you did?", "I can build my business around how I actually work."],
    ["What did you love doing at 10? Does any of it show up in your work now?", "Some of my best instincts showed up early."],
    ["If this week were a movie, what would it be called? Who would play you?", "There's a story in my week."],
    ["Why did you start your business?", "My reason still matters."],
    ["What's your favorite way to spend ten free minutes?", "A little downtime is good for me."],
    ["How did you sleep, and how are you really feeling this morning?", "Whatever kind of morning this is, I can work with it."],
    ["What's a small system that saves you time? How did you come up with it?", "Systems mean I make the decision once, not twelve times."],
    ["Describe your ideal retirement setup.", "Future me earned this."],
    ["What's something that went better than you thought it would? Describe what you expected versus what actually happened.", "Anxiety is a bitch, and it's wrong a lot."],
    ["What's changed in your business this year that your brand doesn't show yet?", "My business grew, and my brand can catch up."],
    ["What's felt easier than usual lately? Could that mean you're ready for a new challenge?", "Easy can be proof of growth."],
    ["What would you choose as your walkout song? Why that one?", "I bring my own energy into the room (boombox optional)."],
    ["What's one thing you can do today in under 10 minutes? Add it to your schedule, and write a follow-up when you're finished.", "Ten focused minutes can move things forward."],
    ["What would you tell yourself on your first day of being a business owner?", "Day-one me would be impressed."],
    ["What's a tool or service that makes your day easier? Where else could you use a hand?", "Asking for help is a power move."],
    ["Describe your favorite mug and why it's the favorite. What's in it right now? (If it's coffee you've reheated three times, same.)", "The little rituals can make my day."],
    ["What's a small change that made a big difference for you? How did you know it was working?", "Small changes add up."],
    ["What's a food you could eat every day? How do you like it best?", "I know what I like, and I'm not apologizing for it."],
    ["Where do you want your energy to go today? What gets less of it?", "I choose where my energy goes."],
    ["Describe your favorite kind of client. (Beyond \"pays on time,\" though that's a solid start.) What makes working with them feel so easy?", "My favorite clients are out there, and I'm making it easier for them to find me."],
    ["What's a tradition you love? How did it start?", "Traditions are mine to keep, tweak, or make up."],
    ["If you could redesign one room, which would it be and how would you change it?", "Sometimes a reset is just moving the furniture."],
    ["What's a quirk of yours that clients end up loving?", "I'm leaning into my weird. It's working."],
    ["What's your go-to karaoke song, even if you'd only ever sing it in the car? Describe your move during the chorus.", "I don't have to be perfect to have fun. Off-key still counts."],
    ["What's one thing you're doing just for you today? When will you fit it in?", "Me time counts as productive. I said so."],
    ["What's one thing you could say no to this week? How would you use that time instead?", "No is a full sentence. So is hell no."],
    ["If you could fill your favorite mug with any drink, even one you can't get at home, what would it be? Where would you drink it?", "A little extra never hurt anybody."],
    ["What's a compliment you still remember? Who said it, and why did it stick?", "On doubtful days, I'll pull the compliments from my back pocket."],
    ["What's something beautiful you noticed recently? Describe it so someone else could picture it.", "I will find beauty in something today."],
    ["What's a lesson you keep relearning? Why do you think it keeps coming back?", "Some lessons need a few laps."],
    ["If you had a free plane ticket today, where would you go? What's the first thing you'd do when you land?", "Where I want to go says a lot about what I need."]
  ];

  function render() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const start = new Date(2026, 0, 1);
    const days = Math.round((today - start) / 86400000);
    const i = ((days % PAIRS.length) + PAIRS.length) % PAIRS.length;
    document.getElementById("date").textContent =
      now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    document.getElementById("prompt").textContent = PAIRS[i][0];
    document.getElementById("affirmation").textContent = PAIRS[i][1];
    const nextMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
    setTimeout(render, nextMidnight - now + 1000);
  }
  render();
</script>
</body>
</html>
